name: simple yaml file

on:
  push:
    branches:
      - jpraveen

jobs:
  job-1:
    runs-on: ubuntu-latest
    steps:
      - name: step-1
        run: |
          echo "hello from job-1"
          hostname -I

      - name: step-2
        run: |
          echo "hello again from job-1"
          netstat -tulnp || echo "netstat not available"

  job-2:
    runs-on: ubuntu-latest
    needs: job-1
    steps:
      - name: step-1
        run: |
          echo "hello from job-2"
          whoami

      - name: step-2
        run: |
          echo "hello again from job-2"
          uname -a
          echo "pipeline completed..!!"
